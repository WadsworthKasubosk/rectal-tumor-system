version: "3.9"

services:
  backend:
    build: ./backend
    container_name: rectal-tumor-api
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/reports:/app/reports
      - ./backend/data.db:/app/data.db
      - ./backend/weights:/app/weights
    environment:
      - DATABASE_URL=sqlite:///app/data.db
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: rectal-tumor-web
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

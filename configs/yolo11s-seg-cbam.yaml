# YOLO11s-seg with CBAM attention modules in backbone
# CBAM (Convolutional Block Attention Module) inserted after P3, P4, P5 feature blocks.
# nc: 1 (rectal tumor)

nc: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]          # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]         # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]  # 2
  - [-1, 1, Conv, [256, 3, 2]]         # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]  # 4
  - [-1, 1, CBAM, [3]]                 # 5: CBAM after P3
  - [-1, 1, Conv, [512, 3, 2]]         # 6-P4/16
  - [-1, 2, C3k2, [512, True]]         # 7
  - [-1, 1, CBAM, [3]]                 # 8: CBAM after P4
  - [-1, 1, Conv, [1024, 3, 2]]        # 9-P5/32
  - [-1, 2, C3k2, [1024, True]]        # 10
  - [-1, 1, CBAM, [3]]                 # 11: CBAM after P5
  - [-1, 1, SPPF, [1024, 5]]           # 12
  - [-1, 2, C2PSA, [1024]]             # 13

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 7], 1, Concat, [1]]          # cat backbone P4 (layer 7)
  - [-1, 2, C3k2, [512, False]]        # 16
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]          # cat backbone P3 (layer 4)
  - [-1, 2, C3k2, [256, False]]        # 19 (P3/8-small)
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 16], 1, Concat, [1]]         # cat head P4
  - [-1, 2, C3k2, [512, False]]        # 22 (P4/16-medium)
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]         # cat head P5
  - [-1, 2, C3k2, [1024, True]]        # 25 (P5/32-large)
  - [[19, 22, 25], 1, Segment, [nc, 32, 256]]   # Detect(P3, P4, P5)

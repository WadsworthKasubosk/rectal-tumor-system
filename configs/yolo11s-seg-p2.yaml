# YOLO11s-seg with P2 feature enhancement
# P2 features are upsampled from P3 neck, fused with backbone P2, then fed back
# to enhance the P3 detection branch. Segment head still uses 3 scales (P3/P4/P5),
# keeping 8400 anchors — identical to baseline for fair comparison.
# nc: 1 (rectal tumor)

nc: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]          # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]         # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]  # 2  (P2 feature for enhancement)
  - [-1, 1, Conv, [256, 3, 2]]         # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]  # 4  (P3 feature)
  - [-1, 1, Conv, [512, 3, 2]]         # 5-P4/16
  - [-1, 2, C3k2, [512, True]]         # 6  (P4 feature)
  - [-1, 1, Conv, [1024, 3, 2]]        # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]        # 8
  - [-1, 1, SPPF, [1024, 5]]           # 9
  - [-1, 2, C2PSA, [1024]]             # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]          # cat backbone P4
  - [-1, 2, C3k2, [512, False]]        # 13
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]          # cat backbone P3
  - [-1, 2, C3k2, [256, False]]        # 16 (P3 neck)
  # --- P2 enhancement branch ---
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # P3 -> P2
  - [[-1, 2], 1, Concat, [1]]          # cat backbone P2 (layer 2)
  - [-1, 2, C3k2, [128, False]]        # 19 (P2 enhancement)
  - [-1, 1, Conv, [128, 3, 2]]         # P2 -> P3
  # --- enhanced P3 (fuses P2 info back) ---
  - [[-1, 16], 1, Concat, [1]]         # cat P3 neck + P2 info
  - [-1, 2, C3k2, [256, False]]        # 22 (P3 enhanced)
  # --- standard FPN continues ---
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]         # cat P4 neck
  - [-1, 2, C3k2, [512, False]]        # 25 (P4)
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]         # cat P5
  - [-1, 2, C3k2, [1024, True]]        # 28 (P5)
  - [[22, 25, 28], 1, Segment, [nc, 32, 256]]   # Detect(P3, P4, P5) — 3 scales
